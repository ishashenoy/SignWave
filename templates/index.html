<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignWave - Hand Rhythm Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container animate-fadeIn">
        <h1>SignWave</h1>
        <p class="subtitle">Hand Gesture Rhythm Game</p>
        <div class="video-container">
            <img src="{{ url_for('video_feed') }}" alt="Video Feed">
        </div>
        <div class="info">
            <p>Match the hand poses as they reach the hit zone!</p>
            <p class="hint">Press ESC in the video window to stop (if using OpenCV window)</p>
        </div>
    </div>
</body>
</html>
